name: Testes

# Roda em maquinas hospedadas pelo GitHub, nao na maquina de ninguem.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  # ----------------------------------------------------------
  #  Linux e macOS - a bateria completa do testar.sh
  #  O macOS importa por um motivo especifico: ele ainda vem com
  #  bash 3.2, que e onde as construcoes modernas quebram.
  # ----------------------------------------------------------
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Versao do bash desta maquina
        run: bash --version | head -1

      - name: Fingir uma CLI de IA instalada
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\necho "claude de mentira"\n' > "$HOME/bin/claude"
          chmod +x "$HOME/bin/claude"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Bateria de testes
        shell: bash
        run: bash testar.sh

  # ----------------------------------------------------------
  #  Windows - instala de verdade num Windows de verdade
  # ----------------------------------------------------------
  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fingir uma CLI de IA instalada
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\bin" | Out-Null
          Set-Content -Path "$env:USERPROFILE\bin\claude.cmd" -Value '@echo claude de mentira'
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\bin"

      - name: Simulacao nao pode escrever nada
        shell: pwsh
        run: |
          $alvo = "$env:RUNNER_TEMP\NaoDeveExistir"
          $env:CEREBRO_YES = "1"; $env:CEREBRO_DRY_RUN = "1"
          $env:CEREBRO_DIR = $alvo; $env:CEREBRO_CLI = "claude"
          $env:CEREBRO_NO_SHORTCUT = "1"; $env:CEREBRO_NO_LAUNCH = "1"
          .\install.ps1
          if (Test-Path $alvo) { throw "FALHOU: --dry-run criou a pasta" }
          Write-Host "PASSOU: nada foi escrito"

      - name: Instalar de verdade
        shell: pwsh
        run: |
          $alvo = "$env:RUNNER_TEMP\OneDrive\Cerebro"
          $env:CEREBRO_YES = "1"; $env:CEREBRO_DRY_RUN = ""
          $env:CEREBRO_DIR = $alvo; $env:CEREBRO_CLI = "claude"
          $env:CEREBRO_NO_SHORTCUT = "1"; $env:CEREBRO_NO_LAUNCH = "1"
          .\install.ps1
          Add-Content -Path $env:GITHUB_ENV -Value "CEREBRO_ALVO=$alvo"

      - name: A estrutura esta toda la?
        shell: pwsh
        run: |
          $alvo = $env:CEREBRO_ALVO
          $faltando = @()
          foreach ($f in @("CLAUDE.md","AGENTS.md","GEMINI.md","config.yml","BOOTSTRAP.md",
                           ".cerebro-install.yml","INBOX\LEIA-ME.md","20-Tarefas\tarefas.md",
                           "90-Sistema\rotinas\hoje.md","90-Sistema\scripts\backup-cerebro.ps1",
                           "90-Sistema\BACKUP-E-SINCRONIZACAO.md",".claude\commands\hoje.md",
                           ".claude\skills\inbox\SKILL.md",".gemini\commands\hoje.toml")) {
            if (-not (Test-Path (Join-Path $alvo $f))) { $faltando += $f }
          }
          if ($faltando.Count -gt 0) { throw "FALTANDO: $($faltando -join ', ')" }
          Write-Host "PASSOU: 14 de 14 arquivos no lugar"

      - name: Reconheceu a pasta como nuvem?
        shell: pwsh
        run: |
          $m = Get-Content (Join-Path $env:CEREBRO_ALVO ".cerebro-install.yml") -Raw
          if ($m -notmatch "pasta_em_nuvem: 1") { throw "FALHOU: nao reconheceu OneDrive" }
          Write-Host "PASSOU"

      - name: O backup leva a pasta oculta?
        shell: pwsh
        run: |
          Set-Location $env:CEREBRO_ALVO
          powershell -ExecutionPolicy Bypass -File "90-Sistema\scripts\backup-cerebro.ps1"
          $pacote = Get-ChildItem "90-Sistema\backups\*.zip" | Select-Object -First 1
          if (-not $pacote) { throw "FALHOU: nao gerou o pacote" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pacote.FullName)
          $tem = $zip.Entries | Where-Object { $_.FullName -like "*.claude/*" -or $_.FullName -like "*claude*" }
          $zip.Dispose()
          if (-not $tem) { throw "FALHOU: o pacote nao levou o .claude" }
          Write-Host "PASSOU: $($pacote.Name)"

      - name: Rodar de novo nao destroi nada
        shell: pwsh
        run: |
          $alvo = $env:CEREBRO_ALVO
          Add-Content -Path (Join-Path $alvo "CLAUDE.md") -Value "MARCA DO USUARIO"
          $env:CEREBRO_YES = "1"; $env:CEREBRO_DIR = $alvo; $env:CEREBRO_CLI = "claude"
          $env:CEREBRO_NO_SHORTCUT = "1"; $env:CEREBRO_NO_LAUNCH = "1"
          .\install.ps1
          $ultima = (Get-Content (Join-Path $alvo "CLAUDE.md"))[-1]
          if ($ultima -notmatch "MARCA DO USUARIO") { throw "FALHOU: sobrescreveu arquivo do usuario" }
          Write-Host "PASSOU: preservou o que o usuario editou"

      - name: O atalho 'agente' entra no perfil?
        shell: pwsh
        run: |
          $alvo = $env:CEREBRO_ALVO
          $env:CEREBRO_YES = "1"; $env:CEREBRO_DIR = $alvo; $env:CEREBRO_CLI = "claude"
          $env:CEREBRO_NO_SHORTCUT = ""; $env:CEREBRO_NO_LAUNCH = "1"
          .\install.ps1
          if (-not (Test-Path $PROFILE)) { throw "FALHOU: nao criou o perfil" }
          $p = Get-Content $PROFILE -Raw
          if ($p -notmatch "function agente") { throw "FALHOU: nao criou a funcao agente" }
          # e a segunda vez nao pode duplicar o bloco
          .\install.ps1
          $p = Get-Content $PROFILE -Raw
          $n = ([regex]::Matches($p, ">>> cerebro >>>")).Count
          if ($n -ne 1) { throw "FALHOU: $n blocos no perfil, esperado 1" }
          Write-Host "PASSOU: atalho criado e sem duplicar"

      - name: Sem nenhuma IA instalada, avisa qual instalar
        shell: pwsh
        run: |
          Remove-Item "$env:USERPROFILE\bin\claude.cmd" -Force
          $env:CEREBRO_YES = "1"; $env:CEREBRO_CLI = ""
          $env:CEREBRO_DIR = "$env:RUNNER_TEMP\NaoUsa"
          # Write-Host escreve no stream de informacao, nao no pipeline:
          # sem o *>&1 a saida chega vazia e o teste acusa falso negativo.
          $saida = (.\install.ps1 *>&1 | Out-String)
          if ($saida -notmatch "Nao encontrei nenhum agente") { throw "FALHOU: nao explicou" }
          if (Test-Path "$env:RUNNER_TEMP\NaoUsa") { throw "FALHOU: instalou mesmo sem IA" }
          Write-Host "PASSOU"
